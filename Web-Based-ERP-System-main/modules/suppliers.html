<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suppliers — UniProcur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-brand" viewBox="0 0 24 24">
      <path fill="currentColor" d="M2 2h7v7H2zM10 2h4v4h-4zM15 2h7v4h-7zM10 7h4v7h-4zM15 7h7v4h-7zM2 10h7v4H2zM2 15h4v7H2zM7 15h7v4H7zM10 20h4v2h-4z"/>
    </symbol>
    <symbol id="icon-dashboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/>
      <rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>
    </symbol>
    <symbol id="icon-suppliers" viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1z"/>
      <circle cx="17" cy="9" r="2.3"/><path d="M17 14a4.5 4.5 0 0 1 4 4.5V20h-3"/>
    </symbol>
    <symbol id="icon-request" viewBox="0 0 24 24">
      <path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M12 11v7M8.5 14.5h7"/>
    </symbol>
    <symbol id="icon-cart" viewBox="0 0 24 24">
      <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.5L21 8H6"/>
      <path d="M9 12h10M10 20h.01M18 20h.01"/>
    </symbol>
    <symbol id="icon-container" viewBox="0 0 24 24">
      <path d="m3 7 9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>
    </symbol>
    <symbol id="icon-reports" viewBox="0 0 24 24">
      <rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 3V2h6v1M9 8h6M9 12h6M9 16h3"/>
    </symbol>
    <symbol id="icon-audit" viewBox="0 0 24 24">
      <path d="M4 20V5M4 20h17"/><path d="m7 15 4-5 3 2 5-7"/><path d="M16 5h3v3"/>
    </symbol>
    <symbol id="icon-support" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 1 1 4.2 1.6c-1.1 1-1.9 1.3-1.9 2.9M12 17.5h.01"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="m10 2-.5 2.2a8 8 0 0 0-1.7 1L5.7 4.5 3.5 8l1.7 1.5a8 8 0 0 0 0 2L3.5 13l2.2 3.5 2.1-.7a8 8 0 0 0 1.7 1L10 19h4l.5-2.2a8 8 0 0 0 1.7-1l2.1.7 2.2-3.5-1.7-1.5a8 8 0 0 0 0-2L20.5 8l-2.2-3.5-2.1.7a8 8 0 0 0-1.7-1L14 2z"/>
      <circle cx="12" cy="10.5" r="3"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
    </symbol>
    <symbol id="icon-exit" viewBox="0 0 24 24">
      <path d="M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5M10 8l4 4-4 4M14 12H3"/>
    </symbol>
  </svg>

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="../index.html" aria-label="UniProcur home">
      <svg class="brand-mark" aria-hidden="true"><use href="#icon-brand"></use></svg><span>UniProcur</span>
    </a>
    <div class="menu-label">Workspace</div>
    <nav class="nav-list" aria-label="Workspace navigation">
      <button class="nav-item" data-page="Dashboard"><svg class="nav-icon" aria-hidden="true"><use href="#icon-dashboard"></use></svg>Dashboard</button>
      <button class="nav-item active" data-page="Suppliers"><svg class="nav-icon" aria-hidden="true"><use href="#icon-suppliers"></use></svg>Suppliers</button>
      <button class="nav-item" data-page="Purchase Request"><svg class="nav-icon" aria-hidden="true"><use href="#icon-request"></use></svg>Purchase Request</button>
      <button class="nav-item" data-page="Purchase Order"><svg class="nav-icon" aria-hidden="true"><use href="#icon-cart"></use></svg>Purchase Order</button>
      <button class="nav-item" data-page="Containers"><svg class="nav-icon" aria-hidden="true"><use href="#icon-container"></use></svg>Containers</button>
      <button class="nav-item" data-page="Reports"><svg class="nav-icon" aria-hidden="true"><use href="#icon-reports"></use></svg>Reports</button>
      <button class="nav-item" data-page="Audit Trail"><svg class="nav-icon" aria-hidden="true"><use href="#icon-audit"></use></svg>Audit Trail</button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" data-page="Support"><svg class="nav-icon" aria-hidden="true"><use href="#icon-support"></use></svg>Support</button>
      <button class="nav-item" data-page="Settings"><svg class="nav-icon" aria-hidden="true"><use href="#icon-settings"></use></svg>Settings</button>
      <div class="profile-mini">
        <div class="avatar" aria-hidden="true">MS</div>
        <div><b>MJ Segovia</b><small>manager@uniprocur.local</small></div>
        <button class="profile-exit-button" type="button" data-logout aria-label="Sign out"><svg class="profile-exit" aria-hidden="true"><use href="#icon-exit"></use></svg></button>
      </div>
    </div>
  </aside>

  <main class="main module-active">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Toggle menu">☰</button>
      <div class="workspace-mark" aria-hidden="true"><svg><use href="#icon-brand"></use></svg></div>
      <div class="page-heading"><small>UniProcur Workspace</small><h1 id="pageTitle">Suppliers</h1></div>
      <div class="top-actions">
        <button class="notification-button" id="notifications" aria-label="Notifications"><svg aria-hidden="true"><use href="#icon-bell"></use></svg></button>
        <div class="user-profile"><div><b>MJ Segovia</b><small>manager@uniprocur.local</small></div><div class="avatar user-avatar" aria-hidden="true"></div></div>
      </div>
    </header>

    <section class="module-workspace">
      <section class="supplier-page" id="supplierPage"></section>
    </section>
  </main>

  <script src="../app.js"></script>
</body>
</html>
